name: Update icon gallery and proof sheet

on:
  push:
    branches: [main]
    paths:
      - 'icons/**'
      - 'scripts/update_icons.py'
      - '.github/workflows/update-icons.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-icons-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install Pillow==11.3.0

      - name: Rebuild gallery and proof sheet
        run: python scripts/update_icons.py

      - name: Commit generated updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Projectivy-Icons-Proof-Sheet.png
          if git diff --cached --quiet; then
            echo 'No updates needed.'
          else
            git commit -m 'Update icon gallery and proof sheet'
            git push
          fi

      - name: Publish icon release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_tag=$(gh release view --json tagName --jq '.tagName')

          if [[ ! "$previous_tag" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a release tag like v1.5, got $previous_tag."
            exit 1
          fi
          next_tag="v${BASH_REMATCH[1]}.$((10#${BASH_REMATCH[2]} + 1))"

          target=$(git rev-parse HEAD)
          empty_tree=$(git mktree </dev/null)

          compare_style() {
            local style="$1" old_path="$2"
            local new_path="icons/styles/$style"
            local before after

            before=$(git rev-parse --verify "$previous_tag:$new_path" 2>/dev/null) ||
              before=$(git rev-parse --verify "$previous_tag:$old_path" 2>/dev/null) ||
              before="$empty_tree"
            after=$(git rev-parse --verify "$target:$new_path" 2>/dev/null) ||
              after="$empty_tree"

            git -c core.quotePath=false diff --name-status --no-renames \
              "$before" "$after" -- ":(glob,icase)*.png" |
              sed "s|^\\(.[[:space:]]\\)|\\1$style/|"
          }

          changes=$(compare_style glossy-cartoon icons &&
                    compare_style steampunk styles/steampunk/icons)

          if [[ -z "$changes" ]]; then
            echo "No icon changes since $previous_tag. Skipping release."
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$next_tag"; then
            echo "Tag $next_tag already exists. Check it before publishing."
            exit 1
          fi

          {
            printf '## Icon changes since %s\n\n' "$previous_tag"
            while IFS=$'\t' read -r status path; do
              case "$status" in
                A) change=Added ;;
                M) change=Updated ;;
                D) change=Removed ;;
                *) change=Changed ;;
              esac
              printf -- '- %s: `%s`\n' "$change" "${path#icons/}"
            done <<< "$changes"
          } | gh release create "$next_tag" \
            --target "$target" \
            --title "Projectivy Transparent Icons $next_tag" \
            --notes-file - \
            --latest
