name: Update icon gallery and proof sheet
on:
  push:
    branches: [main]
    paths:
      - 'icons/**'
      - 'scripts/update_icons.py'
      - '.github/workflows/update-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-icons-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Rebuild gallery and proof sheet
        run: python scripts/update_icons.py
      - name: Commit generated updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Projectivy-Icons-Proof-Sheet.png
          if git diff --cached --quiet; then
            echo 'No updates needed.'
          else
            git commit -m 'Update icon gallery and proof sheet'
            git push
          fi
