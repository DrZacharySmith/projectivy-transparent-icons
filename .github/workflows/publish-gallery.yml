name: Publish searchable icon gallery

on:
  push:
    branches: [main]
    paths:
      - 'icons/**'
      - 'styles/steampunk/icons/**'
      - 'gallery/**'
      - '.github/workflows/publish-gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectivy-gallery-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build searchable gallery
        run: python3 gallery/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _gallery_site
      - id: deploy
        uses: actions/deploy-pages@v4
